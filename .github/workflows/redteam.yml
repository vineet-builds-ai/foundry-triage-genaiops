# Adversarial scan.
#
# Separate from CD on purpose. Red teaming generates adversarial prompts via a
# cloud service, so it is slower and costs money -- putting it in the critical
# path of every merge would make people route around the pipeline. It runs
# weekly, on demand, and before a release that changes the prompt.
#
# Findings are logged to the Foundry project, so the trend across releases is
# visible rather than being a one-off report nobody revisits.

name: Red team

on:
  schedule:
    - cron: '37 3 * * 1'   # Mondays, early. Off-peak and off the hour.
  workflow_dispatch:
    inputs:
      manifest:
        description: 'Agent manifest to scan'
        default: 'agent/agent.yaml'
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: redteam
  cancel-in-progress: false

jobs:
  scan:
    name: Adversarial scan against acceptance
    runs-on: ubuntu-latest
    environment:
      name: acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install with the red team extra
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cloud.txt
          pip install 'azure-ai-evaluation[redteam]'

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run the scan
        run: python scripts/run_redteam.py
        env:
          MANIFEST: ${{ github.event.inputs.manifest || 'agent/agent.yaml' }}
          PYTHONPATH: src
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT_ACCEPTANCE }}
          FOUNDRY_MODEL_DEPLOYMENT: ${{ vars.FOUNDRY_MODEL_DEPLOYMENT }}
          MAX_ATTACK_SUCCESS_RATE: '0.05'
          REDTEAM_OUTPUT: redteam-scan.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redteam-scan-${{ github.run_number }}
          path: redteam-scan.json
          retention-days: 90

      - name: Raise an issue if the scan found something
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Red team scan found issues (run ${context.runNumber})`,
              labels: ['security', 'ai-safety'],
              body: [
                'The scheduled adversarial scan exceeded the attack success',
                'rate threshold.',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'The scan artefact on that run holds the per-objective detail.',
              ].join('\n'),
            });
